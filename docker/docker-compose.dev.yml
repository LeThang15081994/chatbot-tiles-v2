name: chatbot-ceramic-tiles-dev

# Development environment docker-compose
# Includes LiteLLM Router for LLM management and cost tracking
# Includes Redis for caching (semantic cache and standard cache)

services:
  # Redis Cache (for semantic cache and standard cache)
  cache-redis:
    image: redis/redis-stack:7.4.0-v6
    container_name: redis-llmops
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      CACHE_TTL: 900
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always
    networks:
      - gachai-network

  # LiteLLM Router
  # Uses shared PostgreSQL instance from db/postgresql/docker-compose.yml
  litellm-router:
    image: ghcr.io/berriai/litellm:v1.80.8-stable
    container_name: litellm-router-llmops
    ports:
      - "4000:4000"
    volumes:
      - ../app/litellm/litellm_router_config.yaml:/app/config.yaml
    command: ["--config=/app/config.yaml"]
    environment:
      # Use shared PostgreSQL instance from db/postgresql
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gachai_db}:${POSTGRES_PASSWORD:-gachai@123}@postgres-db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
    depends_on:
      cache-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - gachai-network

  rag-app-v2:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: rag-app-v2:latest
    container_name: rag-app-llmops
    ports:
      - "5050:5050"
    environment:
      LITELLM_BASE_URL: http://litellm-router-llmops:4000
      REDIS_URI: redis://cache-redis:6379
      REDIS_URL: redis://cache-redis:6379
      MILVUS_URI: http://milvus-standalone:19530
      DATABASE_URL: postgresql://gachai_db:gachai@123@postgres-db:5432/litellm
    volumes:
      - ../app/logging:/app/logging
    restart: always
    networks:
      - gachai-network

networks:
  gachai-network:
    external: true

